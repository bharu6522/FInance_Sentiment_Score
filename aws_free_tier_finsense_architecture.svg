  <text x="60" y="582" dominant-baseline="central" style="fill:var(--color-text-danger);fill:rgb(127, 44, 40);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central">Not free — keep these outside AWS for zero cost:</text>
  <text x="60" y="602" dominant-baseline="central" style="fill:var(--color-text-danger);fill:rgb(127, 44, 40);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central">OpenAI API (~$2–5/month at low volume) · NewsAPI free plan (100 req/day) · yfinance is fully free</text>

